name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check portable executable
        shell: pwsh
        run: |
          dumpbin /dependents target/release/CrosshairPlus.exe | Tee-Object -FilePath dependents.txt
          if (Select-String -Path dependents.txt -Pattern 'WebView2Loader\.dll' -Quiet) {
            Write-Error "WebView2Loader.dll must be statically linked"
            exit 1
          }

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/CrosshairPlus.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CrosshairPlus.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: CrosshairPlus-windows-x64
          path: |
            target/release/CrosshairPlus.exe
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Crosshair+ ${{ github.ref_name }}
          make_latest: true
          files: |
            target/release/CrosshairPlus.exe
            SHA256SUMS.txt
